name: LinkedIn Job Scout

on:
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Decode Gmail credentials from secrets
        run: |
          echo "${{ secrets.GMAIL_CREDENTIALS_JSON }}" | base64 -d > credentials.json
          echo "${{ secrets.GMAIL_TOKEN_JSON }}"        | base64 -d > token.json

      - name: Run Job Scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID:     ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY:    ${{ secrets.ADZUNA_API_KEY }}
        run: python agent.py

      - name: Upload scout.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-log-${{ github.run_number }}
          path: scout.log
          retention-days: 7
